<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>P5.js 과제 모음</title>
    <style>
        body {
            background: #0b1220;
            font-family: 'Noto Sans KR', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background: #121a2b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 25px rgba(0,0,0,0.3);
        }
        .thumbnail {
            width: 100%;
            height: 260px;
            background-size: cover;
            background-position: center;
        }
        .info {
            padding: 18px 24px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .sub {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 4px;
        }
        a {
            color: white;
            text-decoration: none;
        }
        a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 과제 1 -->
        <a href="./project1/index.html" class="card">
            <div class="thumbnail" style="background-image:url('img/project1.png');"></div>
            <div class="info">
                <div class="title">과제 1 · Abstract Art</div>
                <div class="sub">기본 도형 · 색 실험 · p5.js</div>
            </div>
        </a>

        <!-- 과제 4 -->
        <a href="./project4/index.html" class="card">
            <div class="thumbnail" style="background-image:url('img/project4.gif');"></div>
            <div class="info">
                <div class="title">과제 4 · Animated Abstract</div>
                <div class="sub">GIF 애니메이션</div>
            </div>
        </a>

        <!-- 과제 2 -->
        <a href="./project2/index.html" class="card">
            <div class="thumbnail" style="background-image:url('img/project2.png');"></div>
            <div class="info">
                <div class="title">과제 2 · Caricature</div>
                <div class="sub">캐릭터 드로잉</div>
            </div>
        </a>

        <!-- 과제 3 -->
        <a href="./project3/index.html" class="card">
            <div class="thumbnail" style="background-image:url('img/project3.gif');"></div>
            <div class="info">
                <div class="title">과제 3 · Interactive Character</div>
                <div class="sub">인터랙션 · p5.js</div>
            </div>
        </a>

    </div>
</body>
</html>
